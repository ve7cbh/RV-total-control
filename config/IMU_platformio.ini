[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit LSM303DLHC@^1.0.7
    adafruit/Adafruit L3GD20 U@^1.2.4
    adafruit/Adafruit BMP085 Unified@^1.2.3
    adafruit/Adafruit 10DOF@^1.1.4
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit GFX Library@^1.11.9
    knolleary/PubSubClient@^2.8
    ESP Async WebServer
    AsyncTCP
    bblanchon/ArduinoJson@^7.0.4
