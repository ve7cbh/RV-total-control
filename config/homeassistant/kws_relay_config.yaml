# KWS-303L Relay Control — config additions
#
# PART 1 — shell_command entries
# ================================
# You already have a `shell_command:` block in configuration.yaml (added
# for the Waveshare relay work). Add these four lines INSIDE that existing
# block — do not create a second `shell_command:` key, merge into the one
# you already have:

  grid_relay_on:   "python3 /config/kws_relay.py 1 1"
  grid_relay_off:  "python3 /config/kws_relay.py 1 0"
  # Generator lines below are harmless to add now even though the meter
  # isn't installed yet — they just won't do anything until it is.
  generator_relay_on:  "python3 /config/kws_relay.py 2 1"
  generator_relay_off: "python3 /config/kws_relay.py 2 0"

# PART 2 — alarm-aware reconnect scripts
# ========================================
# Add these two to your existing scripts.yaml (inside the existing
# top-level list — no `script:` key, same as everything else there).
# These guard against writing 1 to the relay register while the meter
# has an active alarm, since the doc confirms remote ON does NOT clear
# alarms the way the physical switch does — writing 1 in that state is
# pointless at best, possibly confusing at worst.

  kws_grid_connect:
    alias: "KWS Grid - Connect (alarm-checked)"
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: sensor.grid_alarm_code
            state: "0"
        then:
          - service: shell_command.grid_relay_on
          - service: logbook.log
            data:
              name: "Grid Relay"
              message: "Grid reconnected via HA"
        else:
          - service: logbook.log
            data:
              name: "Grid Relay"
              message: "Reconnect blocked — active alarm code {{ states('sensor.grid_alarm_code') }}. Clear alarm on meter front panel first."
          - service: persistent_notification.create
            data:
              title: "Grid Relay — Reconnect Blocked"
              message: "Grid meter has an active alarm (code {{ states('sensor.grid_alarm_code') }}). Remote reconnect does not clear alarms — clear it on the meter itself, then retry."

  kws_grid_disconnect:
    alias: "KWS Grid - Disconnect"
    mode: single
    sequence:
      - service: shell_command.grid_relay_off
      - service: logbook.log
        data:
          name: "Grid Relay"
          message: "Grid disconnected via HA"

# PART 3 — template switch
# ==========================
# This is a NEW file, e.g. kws_relay_switches.yaml. Add to
# configuration.yaml as its own line (do not merge into shell_command):
#
#   switch: !include kws_relay_switches.yaml
#
# IMPORTANT — same wrapping-key issue as before: since configuration.yaml
# already supplies the `switch:` key via the include line, this file's
# content must be a bare LIST (starts with `- platform:`), not wrapped
# in its own `switch:` key. The content below (between the markers) is
# what goes in that file — nothing else.

# ===== START kws_relay_switches.yaml content =====
- platform: template
  switches:
    grid_connection:
      friendly_name: "Grid Connection"
      icon_template: >-
        {% if states('sensor.grid_relay_state') | int(0) == 1 %}
          mdi:transmission-tower
        {% else %}
          mdi:transmission-tower-off
        {% endif %}
      value_template: "{{ states('sensor.grid_relay_state') | int(0) == 1 }}"
      turn_on:
        service: script.kws_grid_connect
      turn_off:
        service: script.kws_grid_disconnect

    # Inert until GENERATOR_ENABLED = True in kws_mqtt.py and the meter
    # is physically wired — value_template will just read unavailable/off
    # until sensor.generator_relay_state exists. Calls shell_command
    # directly for now (no alarm-check script yet) since it's inert —
    # add the same alarm-aware pattern as grid when that meter goes live.
    generator_connection:
      friendly_name: "Generator Connection"
      icon_template: >-
        {% if states('sensor.generator_relay_state') | int(0) == 1 %}
          mdi:transmission-tower
        {% else %}
          mdi:transmission-tower-off
        {% endif %}
      value_template: "{{ states('sensor.generator_relay_state') | int(0) == 1 }}"
      turn_on:
        service: shell_command.generator_relay_on
      turn_off:
        service: shell_command.generator_relay_off
# ===== END kws_relay_switches.yaml content =====
