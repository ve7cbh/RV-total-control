# RVTC — GPS position sensors for the leveling dashboard
#
# Pulls latitude/longitude from the existing gps_mqtt.py bridge
# (rvtc/sensors/gps/#), which is already running and confirmed working —
# this just exposes two of its fields as Home Assistant sensors so they
# can sit alongside the IMU's heading/pitch/roll on the same dashboard.

mqtt:
  sensor:
    - name: "GPS Latitude"
      unique_id: gps_latitude
      state_topic: "rvtc/sensors/gps/latitude"
      unit_of_measurement: "°"
      icon: mdi:latitude

    - name: "GPS Longitude"
      unique_id: gps_longitude
      state_topic: "rvtc/sensors/gps/longitude"
      unit_of_measurement: "°"
      icon: mdi:longitude

    - name: "GPS Fix Mode"
      unique_id: gps_fix_mode
      state_topic: "rvtc/sensors/gps/fix_mode"
      icon: mdi:crosshairs-gps
      # 0=unknown, 1=no fix, 2=2D, 3=3D — matches gps_mqtt.py directly.
      # Worth showing alongside lat/long since a stale or degraded fix
      # would make the position display quietly wrong without this.
