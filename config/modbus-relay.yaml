# ============================================================
# RVTC — EPEVER 8 channel relay Modbus Integration
# File: config/modbus_relay.yaml
# Include in HA configuration.yaml:
#   modbus: !include modbus_relay.yaml
# (Append to existing modbus list if modbus_samlux.yaml is
#  already included — see note below.)
#
# Gateway: Waveshare RS-485/1, IP 192.168.88.12, TCP 4001
# Device: Waveshare 8 channel relay, Modbus slave 1
# Baud: 9600 8N1 (set on gateway port 1 — not in this file)
#
# Addressing: all addresses are literal/direct (0-based PDU).
# Equivalent mbpoll verification command uses -0 flag.
#
#
# NOTE — multiple modbus: blocks in configuration.yaml:
#   YAML does not allow duplicate top-level keys. If
#   modbus_xxxxx.yaml is already included as:
#     modbus: !include modbus_xxxxx.yaml
#   change BOTH files to use a list and merge them:
#     modbus:
#       - !include config/modbus_xxxxx.yaml
#       - !include config/modbus_relay.yaml
#   See HA docs: https://www.home-assistant.io/integrations/modbus/
# ============================================================

modbus:
  - name: "waveshare_rtu_8ch"
    type: rtuovertcp
    host: 192.168.88.12
    port: 4001
    
    switches:
      - name: "Waveshare Relay 1"
        slave: 1
        address: 0
        write_type: coil

      - name: "Waveshare Relay 2"
        slave: 1
        address: 1
        write_type: coil

      - name: "Waveshare Relay 3"
        slave: 1
        address: 2
        write_type: coil

      - name: "Waveshare Relay 4"
        slave: 1
        address: 3
        write_type: coil

      - name: "Waveshare Relay 5"
        slave: 1
        address: 4
        write_type: coil

      - name: "Waveshare Relay 6"
        slave: 1
        address: 5
        write_type: coil

      - name: "Waveshare Relay 7"
        slave: 1
        address: 6
        write_type: coil

      - name: "Waveshare Relay 8"
        slave: 1
        address: 7
        write_type: coil
