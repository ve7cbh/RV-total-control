# RVTC — IMU node Modbus polling (HW-25)
#
# Polls the IMU's holding registers through the Waveshare gateway at
# 192.168.88.8:4001 (RS-485/4), same gateway/protocol pattern as
# modbus_epever.yaml / modbus_samlux_clean.yaml, just a separate hub entry
# since it's a distinct physical gateway port.
#
# Register map (from rvtc-imu/src/main.cpp): 0=heading, 1=pitch, 2=roll,
# all signed int16, x10 scaled (e.g. raw 282 = 28.2 degrees). data_type:
# int16 + scale: 0.1 below means Home Assistant does that conversion
# itself — no template sensor needed just to divide by 10.
#
# This polls the RS-485/Modbus PRIMARY path directly, independent of the
# ESP32's own WiFi/MQTT (secondary) path — matches the project's general
# principle that RS-485 is the authoritative source, WiFi is convenience
# only. If the ESP32's WiFi is down, this dashboard still works.

modbus:
  - name: imu_gateway
    type: tcp
    host: 192.168.88.8
    port: 4001
    delay: 0
    message_wait_milliseconds: 30
    sensors:
      - name: "IMU Heading"
        unique_id: imu_heading
        slave: 10
        address: 0
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°"
        scan_interval: 3

      - name: "IMU Pitch"
        unique_id: imu_pitch
        slave: 10
        address: 1
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 2
        unit_of_measurement: "°"
        scan_interval: 3

      - name: "IMU Roll"
        unique_id: imu_roll
        slave: 10
        address: 2
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 2
        unit_of_measurement: "°"
        scan_interval: 3

# scan_interval is 3s per sensor — matches the general feel of the earlier
# web page (250ms MQTT publish) closely enough for a leveling dashboard
# without hammering a 9600-baud RS-485 line with requests. Tighten if you
# want more responsiveness while actively jacking up/down; 9600 baud puts
# a real floor on how fast this can usefully go, though — three registers
# at that baud rate is a small fraction of a second per poll, so there's
# room to go faster if 3s ever feels sluggish.
