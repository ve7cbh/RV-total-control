# RVTC — Home Assistant Modbus config for KWS-303L AC Power Meters
# Grid meter:     RS-485/3, IP 192.168.88.7, TCP 4001, slave 1
# Generator meter: RS-485/3, IP 192.168.88.7, TCP 4001, slave 2 (pending physical install)
#
# Register map: KWS-303L_Register_Map_RVTC.docx (community reverse-engineered)
# All addresses literal/direct — no Modicon offset. Same convention as SAMLUX and EPEVER.
# Function Code 03 (holding registers).
#
# Note on energy register 55: Modbus value (~36 kWh) does not match meter display
# (~102 kWh). The Modbus register is a separate accumulator — useful for relative
# tracking but not absolute lifetime energy. Read absolute total from meter display.
#
# Parity: Even — confirmed live 2026-06-19. Set on gateway port 3 serial config.

- name: kws_grid
  type: tcp
  host: 192.168.88.7
  port: 4001
  timeout: 5
  delay: 0
  message_wait_milliseconds: 30

  sensors:

    - name: "Grid Voltage"
      unique_id: kws_grid_voltage
      slave: 1
      address: 14
      input_type: holding
      data_type: uint16
      scale: 0.01
      precision: 1
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      scan_interval: 10

    - name: "Grid Current"
      unique_id: kws_grid_current
      slave: 1
      address: 18
      input_type: holding
      data_type: uint16
      scale: 0.001
      precision: 3
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      scan_interval: 10

    - name: "Grid Power"
      unique_id: kws_grid_power
      slave: 1
      address: 26
      input_type: holding
      data_type: uint16
      scale: 0.1
      precision: 1
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      scan_interval: 10

    - name: "Grid Power Factor"
      unique_id: kws_grid_power_factor
      slave: 1
      address: 48
      input_type: holding
      data_type: uint16
      scale: 0.001
      precision: 3
      unit_of_measurement: ""
      state_class: measurement
      scan_interval: 10

    - name: "Grid Frequency"
      unique_id: kws_grid_frequency
      slave: 1
      address: 51
      input_type: holding
      data_type: uint16
      scale: 0.01
      precision: 2
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement
      scan_interval: 10

    - name: "Grid Energy"
      unique_id: kws_grid_energy
      slave: 1
      address: 55
      input_type: holding
      data_type: uint16
      scale: 0.001
      precision: 3
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      scan_interval: 30

    - name: "Grid Meter Temperature"
      unique_id: kws_grid_temperature
      slave: 1
      address: 60
      input_type: holding
      data_type: uint16
      scale: 1
      precision: 0
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      scan_interval: 60

    - name: "Grid Alarm Code"
      unique_id: kws_grid_alarm
      slave: 1
      address: 62
      input_type: holding
      data_type: uint16
      scale: 1
      precision: 0
      unit_of_measurement: ""
      state_class: measurement
      scan_interval: 30
      # 0=None, 1=Over Voltage, 2=Under Voltage, 4=Over Current, 32=Over Temperature

    - name: "Grid Relay State"
      unique_id: kws_grid_relay
      slave: 1
      address: 63
      input_type: holding
      data_type: uint16
      scale: 1
      precision: 0
      unit_of_measurement: ""
      state_class: measurement
      scan_interval: 30
      # 1=ON, 0=OFF

- name: kws_generator
  type: tcp
  host: 192.168.88.7
  port: 4001
  timeout: 5
  delay: 0
  message_wait_milliseconds: 30
  # NOTE: generator meter slave 2 not yet physically wired.
  # Entities will show unavailable until meter is installed.
  # No config changes needed when meter is connected.

  sensors:

    - name: "Generator Voltage"
      unique_id: kws_generator_voltage
      slave: 2
      address: 14
      input_type: holding
      data_type: uint16
      scale: 0.01
      precision: 1
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
