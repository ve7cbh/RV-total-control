# RVTC — Home Assistant Modbus config for SAMLUX EVO-2212
# Confirmed working 2026-06-17: TCP reachable, slave 1 answers (mbpoll test, register 1 = 2094)
#
# Connection details (confirmed):
#   Gateway:      Waveshare 8-port RS-485/TCP, channel RS-485/2
#   Host:         192.168.88.6
#   Port:         4001          (every gateway channel uses 4001 — IP differentiates, not port)
#   Slave/unit:   1             (EVO-2212 default, 01H per manual)
#   Serial:       9600 8N1      (already matched on gateway — not relevant to this file)
#
# Address convention — CORRECTED, same session, this time for real:
#   The "+1 offset" documented here yesterday was WRONG. Root cause: mbpoll defaults to
#   classic Modicon-style 1-based reference numbering and silently subtracts 1 from
#   whatever you pass to -r before putting it on the wire. The -0 flag disables that
#   and addresses the literal PDU register directly. We weren't using -0, which is why
#   everything we read looked shifted by one register from where it should have been.
#   Confirmed by re-polling register 261 WITH -0 and getting the same value (119.03V)
#   we'd previously gotten from register 262 WITHOUT -0 — i.e. mbpoll's default mode
#   was quietly sending 261 when we typed 262.
#   CORRECT RULE: the manual's hex address, converted straight to decimal, IS the real
#   wire/PDU address. No adjustment needed. This also matches the manual's own 03H
#   worked example, which uses literal unshifted addressing — the thing that didn't
#   add up yesterday, now explained.
#   Function 03H = "holding" registers in HA's input_type field.
#   Max 50 registers per single read on EVO-series — keep grouped reads under that.
#   NOTE FOR FUTURE mbpoll USE: always pass -0 to address registers literally, matching
#   what HA/pymodbus and the manual both expect. Without -0, subtract 1 from whatever
#   mbpoll reports the address as, or just always use -0 and skip the math.
#
# Scale values below are taken from the manual's Units column (e.g. "0.01 Hz" means
# multiply the raw register by 0.01 to get Hz) — these are generic engineering units,
# not the proprietary address map, so they're safe to keep here.
#
# IMPORTANT: do not paste real SAMLUX register ADDRESSES into chat with Claude —
# the address map is held locally under NDA. Fill in the address: fields below
# directly in this file, not in conversation.
#
# Usage: either paste this block into configuration.yaml under modbus:, or save as-is
# and add `modbus: !include modbus_samlux.yaml` to configuration.yaml.

modbus:
  - name: samlux_evo2212
    type: tcp
    host: 192.168.88.6
    port: 4001
    timeout: 5
    delay: 0
    message_wait_milliseconds: 30   # small gap between requests; raise if you see sporadic errors

    sensors:
      # --- WORKING EXAMPLE — confirmed live via mbpoll, register 1, value 2094 ---
      # Meaning of register 1 is unknown until checked against your local register map.
      # Replace name/unit/scale once you know what it actually represents.
      - name: "SAMLUX Test Register 1"
        unique_id: samlux_test_register_1
        slave: 1
        address: 1
        input_type: holding
        data_type: uint16
        scale: 1
        unit_of_measurement: ""
        scan_interval: 30

      # =========================================================================
      # Below: named placeholders for read-only data registers, per manual table.
      # address: left blank — fill in directly from your local manual (not in chat).
      # scale: filled in from the manual's Units column where shown.
      # =========================================================================

      - name: "SAMLUX Status of GEN Input"
        unique_id: samlux_status_gen_input
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "SAMLUX Frequency of GEN Input"
        unique_id: samlux_freq_gen_input
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Voltage of GEN Input"
        unique_id: samlux_voltage_gen_input
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Status of Grid Input"
        unique_id: samlux_status_grid_input
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "SAMLUX Frequency of Grid Input"
        unique_id: samlux_freq_grid_input
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Voltage of Grid Input"
        unique_id: samlux_voltage_grid_input
        slave: 1
        address: 261        # 105H direct, NO offset — CONFIRMED via mbpoll -0: 119.03V, matches grid voltage
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Input Current"
        unique_id: samlux_input_current
        slave: 1
        address: 262        # 106H direct, NO offset — CONFIRMED via mbpoll -0: 4.41A, matches ~4A load
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Input VA"
        unique_id: samlux_input_va
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 1
        unit_of_measurement: "VA"
        device_class: apparent_power
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Input Watt"
        unique_id: samlux_input_watt
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Output Frequency"
        unique_id: samlux_output_frequency
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Output Voltage"
        unique_id: samlux_output_voltage
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.01
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Invert/Charge Current"
        unique_id: samlux_invert_charge_current
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: int16      # may go negative (charge vs invert direction) — confirm in manual
        scale: 0.01
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Invert/Charge VA"
        unique_id: samlux_invert_charge_va
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 1
        unit_of_measurement: "VA"
        device_class: apparent_power
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Invert/Charge Watt"
        unique_id: samlux_invert_charge_watt
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: int16      # may go negative (charge vs invert direction) — confirm in manual
        scale: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Battery Voltage"
        unique_id: samlux_battery_voltage
        slave: 1
        address: 276        # 114H direct, NO offset — CONFIRMED via mbpoll -0: 13.005V, consistent with prior 13.03V reading
        input_type: holding
        data_type: uint16
        scale: 0.001
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Battery Current"
        unique_id: samlux_battery_current
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: int16      # may go negative (charge vs discharge) — confirm in manual
        scale: 0.1
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX External Current"
        unique_id: samlux_external_current
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: int16
        scale: 0.1
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Battery Temperature"
        unique_id: samlux_battery_temperature
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: int16
        scale: 0.1
