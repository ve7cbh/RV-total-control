        scan_interval: 30

      - name: "SAMLUX Error Code"
        unique_id: samlux_error_code
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "SAMLUX Charge Stage"
        unique_id: samlux_charge_stage
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "SAMLUX Firmware Version"
        unique_id: samlux_version
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.01
        scan_interval: 300    # rarely changes — poll infrequently

      - name: "SAMLUX Compensating Voltage"
        unique_id: samlux_compensating_voltage
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: uint16
        scale: 0.001
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 30

    # If a register turns out signed where it's currently uint16 (or vice versa),
    # adjust data_type accordingly — int16 for anything that can go negative
    # (charge/discharge current, temperature below 0°C, etc.)
    #
    # If a value spans two registers (32-bit), use data_type: uint32 or int32 —
    # HA derives the register count from data_type automatically.
    #
    # =========================================================================
    # NOT INCLUDED HERE: the large block of Read/Write configuration parameters
    # (absorb voltage, equalization voltage, low/high voltage cutoffs, GEN ON/OFF
    # timing, charge mode, relay function, comm ID, etc.). Those are settings you
    # write TO the device, not sensor readings — in HA they belong under a
    # `number:` or `switch:` platform block (via modbus), not `sensors:`.
    # Worth building as a separate config once read-side polling is confirmed
    # working, since writing to the wrong register on a live inverter-charger
    # carries more risk than reading one.
    # =========================================================================
