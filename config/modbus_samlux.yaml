        state_class: measurement
        scan_interval: 30

      - name: "SAMLUX Heat Sink Temperature"
        unique_id: samlux_heatsink_temperature
        slave: 1
        address:             # <-- FILL IN
        input_type: holding
        data_type: int16
        scale: 0.1
