    expire_after: 60

  - name: "Generator Alarm Code"
    unique_id: mqtt_generator_alarm
    state_topic: "rvtc/sensors/generator/alarm_code"
    state_class: measurement
    expire_after: 60

  - name: "Generator Relay State"
    unique_id: mqtt_generator_relay_state
    state_topic: "rvtc/sensors/generator/relay_state"
    state_class: measurement
    expire_after: 60
    # 1=connected, 0=disconnected — inert until generator meter is wired
    # and GENERATOR_ENABLED = True in kws_mqtt.py

