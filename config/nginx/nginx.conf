events {}

http {
    # Ensures correct MIME types are served (e.g. CSS as text/css)
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name weewx.lan;
        location / {
            root /usr/share/nginx/html/belchertown;
            index index.html;
        }
    }

    server {
        listen 80;
        server_name grafana.lan;
        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name influxdb.lan;
        location / {
            proxy_pass http://influxdb:8086;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name homeassistant.lan;
        location / {
            proxy_pass http://192.168.88.3:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name esphome.lan;
        location / {
            resolver 127.0.0.11 valid=30s;
            set $upstream http://esphome:6052;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name pihole.lan;
        location / {
            proxy_pass http://pihole:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
