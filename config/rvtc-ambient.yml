substitutions:
  device_name: rvtc-ambient
  friendly_name: "RVTC Ambient"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging (set to WARN in production to reduce noise)
logger:
  level: DEBUG

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Over-the-air updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP recommended for a fixed sensor node
  manual_ip:
    static_ip: 192.168.88.XX   # TODO: assign a static IP
    gateway: 192.168.88.1
    subnet: 255.255.255.0
    dns1: 192.168.88.3          # Pi-hole

  # Fallback hotspot if wifi fails — lets you recover OTA
  ap:
    ssid: "${device_name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

# ─────────────────────────────────────────────
# 1-Wire bus — DS18B20 sensors
# Pull-up: 4.7 kΩ between Data and 3.3V
# ─────────────────────────────────────────────
dallas_temp:
  - pin: GPIO4
    update_interval: 60s

# ─────────────────────────────────────────────
# I2C bus — BME280 barometric/humidity sensor
# Pull-ups: 4.7 kΩ on SDA and SCL to 3.3V
# ─────────────────────────────────────────────
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false   # Set true on first boot to confirm address, then back to false

# ─────────────────────────────────────────────
# Sensors
# ─────────────────────────────────────────────
sensor:

  # --- DS18B20 Wired Temperature Sensors ---
  # On first boot with scan: true on dallas_temp, ESPHome will log each sensor's
  # address. Paste those addresses below, then set scan to false.

  - platform: dallas_temp
    address: 0x0000000000000000   # TODO: replace with real address
    name: "Temperature Inside RV"
    id: temp_inside_rv
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dallas_temp
    address: 0x0000000000000001   # TODO: replace with real address
    name: "Temperature Outside RV"
    id: temp_outside_rv
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dallas_temp
    address: 0x0000000000000002   # TODO: replace with real address
    name: "Temperature Battery Compartment"
    id: temp_battery_compartment
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dallas_temp
    address: 0x0000000000000003   # TODO: replace with real address
    name: "Temperature Battery Box"
    id: temp_battery_box
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dallas_temp
    address: 0x0000000000000004   # TODO: replace with real address
    name: "Temperature Basement Storage"
    id: temp_basement_storage
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # --- BME280 Barometric Pressure / Humidity / Temperature ---
  # Address is 0x76 with SDO pin low (typical default)
  # If your module has SDO pulled high, change to 0x77

  - platform: bme280_i2c
    address: 0x76
    update_interval: 60s

    temperature:
      name: "Barometer Temperature"
      id: baro_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1

    pressure:
      name: "Barometric Pressure"
      id: baro_pressure
      unit_of_measurement: "hPa"
      device_class: pressure
      state_class: measurement
      accuracy_decimals: 1

    humidity:
      name: "Barometer Humidity"
      id: baro_humidity
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1

  # WiFi signal strength — useful for diagnosing connectivity
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ─────────────────────────────────────────────
# Text sensor — uptime in human-readable form
# ─────────────────────────────────────────────
text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
