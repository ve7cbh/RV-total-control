# telegraf_battery.conf — RVTC battery current shunt (JSY-MK-229, 485-7 / HW-24)
#
# Subscribes to the aggregate JSON topic published by battery_current_mqtt.py
# (rvtc/sensors/battery_current/json) — NOT the flat per-field topics under
# rvtc/sensors/battery_current/#, which are for MQTT Explorer / Home Assistant
# and aren't meant to be re-parsed here.
#
# IMPORTANT — token/org/url below are placeholders. Copy the exact
# [[outputs.influxdb_v2]] block (token, org, url) from an existing working
# file such as telegraf_grid.conf rather than trusting the values here — I
# don't have visibility into how the token is actually being supplied
# (env var, secrets file, etc.) in this repo.

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rvtc/sensors/battery_current/json"]
  data_format = "json"
  name_override = "battery_current"

  # All fields are already numeric or short strings (direction, supply_mode)
  # from battery_current_mqtt.py's decode() — no json_string_fields needed
  # beyond marking the two text fields explicitly so Telegraf doesn't try to
  # coerce them to floats and drop them.
  json_string_fields = ["direction", "supply_mode"]

  # No tags needed beyond what name_override provides — this is a single
  # device on a dedicated bus, unlike e.g. the KWS meters which split into
  # grid/generator via topic.

[[outputs.influxdb_v2]]
  urls         = ["http://192.168.88.3:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "rvtc"
  bucket = "rvtc"
  namepass = ["battery_current"]
