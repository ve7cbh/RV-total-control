[[inputs.mqtt_consumer]]
  name_override = "grid"
  servers       = ["tcp://192.168.88.3:1883"]
  topics        = ["rvtc/sensors/grid/#"]
  data_format   = "value"
  data_type     = "float"

  [inputs.mqtt_consumer.tags]
    source = "kws303l_grid"

[[outputs.influxdb_v2]]
  urls         = ["http://192.168.88.3:8086"]
  token        = "${INFLUX_TOKEN}"
  organization = "rvtc"
  bucket       = "rvtc"
