# RVTC Telegraf source config — MeshCore (mctomqtt -> Mosquitto -> InfluxDB)
#
# Two inputs, one per mctomqtt topic (packets/status have different shapes,
# same split pattern as weather's raw/corrected and battery's flat/json).
#
# Per RVTC's own documented gotcha (System Reference §9): mctomqtt, like
# WeeWX, quotes every numeric value in its packets JSON ("len": "34", not
# "len": 34) — plain `data_format = "json"` will mistype or drop these.
# Using json_v2 with explicit `type =` on every field, same fix already
# applied for telegraf_weather.conf.
#
# Setup (this file does NOT get picked up by a plain restart):
#   1. Save this file to config/telegraf/telegraf_meshcore.conf
#   2. Add a bind mount for it in docker-compose.yml's telegraf service,
#      alongside the existing telegraf_*.conf mounts:
#        - ./config/telegraf/telegraf_meshcore.conf:/etc/telegraf/telegraf.d/telegraf_meshcore.conf:ro
#   3. docker compose up -d telegraf   (NOT `docker restart` — new mount
#      needs the container recreated, same lesson as the 9001 websocket
#      port and the battery config gotchas already in §9)
#
# This file does not include its own [[outputs.influxdb_v2]] block, matching
# every telegraf_*.conf except telegraf_snmp.conf. If meshcore_packets /
# meshcore_status never show up in InfluxDB despite Telegraf loading this
# file with no error, check whether the output really is defined globally
# elsewhere before assuming this file is broken (§9's snmp note flags this
# exact ambiguity).

# ---------------------------------------------------------------------------
# meshcore_packets  <-  meshcore/DUQ/+/packets
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  name_override = "meshcore_packets"
  servers = ["tcp://mosquitto:1883"]
  topics = ["meshcore/DUQ/+/packets"]
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999999-07:00"

    # station = the observer/repeater reporting to MQTT, NOT the LoRa
    # packet's sender (mctomqtt's own README is explicit about this
    # distinction) — this is the "sorted by user" grouping key.
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origin"
      rename = "station"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origin_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "direction"

    # "D" = direct/0-hop, "F" = flood-routed — confirmed against mctomqtt's
    # own README examples, not guessed.
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "route"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "packet_type"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hash"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "len"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload_len"
      type = "int"

    # SNR/RSSI/score are RX-only per the firmware docs -- TX packets
    # (this node's own retransmissions) omit them entirely. Missing
    # optional=true here caused real "the path SNR doesn't exist" errors
    # in production logs (found 2026-08-27), one per TX packet -- non-fatal
    # on their own, but worth fixing now that it's been confirmed live
    # rather than left as a known bug.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "SNR"
      rename = "snr"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "RSSI"
      rename = "rssi"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "score"
      type = "int"
      optional = true

    # Only present on direct ("D") packets, per the actual observer
    # firmware docs -- "path" is a JSON array of hex hop tokens
    # (["aa","bb","cc"]), not a scalar. json_v2 can't parse an array
    # directly, so rather than hope an array stringifies through
    # cleanly (untested assumption, dropped after it didn't populate),
    # this uses gjson's documented array features instead: `path.#` is
    # array length (hop count) directly, and `path.N` indexes a single
    # element -- both standard gjson syntax, not a guess. 8 hops covers
    # any realistic mesh route; unused indices are simply absent.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.#"
      rename = "hop_count"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.0"
      rename = "hop0"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.1"
      rename = "hop1"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.2"
      rename = "hop2"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.3"
      rename = "hop3"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.4"
      rename = "hop4"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.5"
      rename = "hop5"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.6"
      rename = "hop6"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "path.7"
      rename = "hop7"
      type = "string"
      optional = true

# ---------------------------------------------------------------------------
# meshcore_status  <-  meshcore/DUQ/+/status
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  name_override = "meshcore_status"
  servers = ["tcp://mosquitto:1883"]
  topics = ["meshcore/DUQ/+/status"]
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999999-07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origin"
      rename = "station"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origin_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "model"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "firmware_version"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "repeat"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "status"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "client_version"
      type = "string"

    # Kept as a raw string here ("910.424988,62.5,7,5") — split into typed
    # freq_mhz/bandwidth_khz/spreading_factor/coding_rate fields below by
    # the starlark processor, not here. json_v2 has no delimiter-split of
    # its own.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "radio"
      type = "string"

    # stats.* arrive as real JSON numbers (unlike the packets topic, which
    # stringifies everything) — no type coercion needed, but declared
    # explicitly anyway for consistency and to catch a future upstream
    # format change loudly instead of silently.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.battery_mv"
      rename = "battery_mv"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.uptime_secs"
      rename = "uptime_secs"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.packets_sent"
      rename = "packets_sent"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.packets_received"
      rename = "packets_received"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.errors"
      rename = "errors"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.queue_len"
      rename = "queue_len"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.noise_floor"
      rename = "noise_floor"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.tx_air_secs"
      rename = "tx_air_secs"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.rx_air_secs"
      rename = "rx_air_secs"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.recv_errors"
      rename = "recv_errors"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stats.internal_heap"
      rename = "internal_heap"
      type = "int"

# ---------------------------------------------------------------------------
# Derive radio_config split + clock skew for meshcore_status only.
#
# Clock skew = the observer's own device_timestamp (used as this metric's
# time via timestamp_path above) minus wall-clock time when Telegraf
# actually processed the message. This bundles broker/queueing latency in
# with true clock drift, same caveat noted when this was first designed —
# if skew jumps around rather than drifting smoothly, that's latency, not
# the device's clock actually moving.
# ---------------------------------------------------------------------------
[[processors.starlark]]
  namepass = ["meshcore_status"]
  source = '''
load("time.star", "time")

def apply(metric):
    radio = metric.fields.get("radio")
    if radio:
        parts = radio.split(",")
        if len(parts) == 4:
            metric.fields["freq_mhz"] = float(parts[0])
            metric.fields["bandwidth_khz"] = float(parts[1])
            metric.fields["spreading_factor"] = int(parts[2])
            metric.fields["coding_rate"] = int(parts[3])

    now_ns = time.now().unix_nano
    metric.fields["clock_skew_ms"] = (metric.time - now_ns) / 1000000.0

    return metric
'''

# ---------------------------------------------------------------------------
# Join hop0..hop7 into one display string, e.g. "aa -> bb -> cc".
# hop_count itself comes straight from path.# above -- no decoding needed.
# ---------------------------------------------------------------------------
[[processors.starlark]]
  namepass = ["meshcore_packets"]
  source = '''
def apply(metric):
    hops = []
    for i in range(8):
        h = metric.fields.get("hop" + str(i))
        if h == None:
            break
        hops.append(h)
    if hops:
        metric.fields["path_str"] = " -> ".join(hops)
    return metric
'''

# ---------------------------------------------------------------------------
# meshcore_neighbors  <-  meshcore/DUQ/+/neighbors
#
# Real zero-hop RF neighbor data (SNR + last-heard age per neighbor),
# unlike the packets-based route:"D" approach above, which we learned the
# hard way is path-routing, not hop distance. json_v2's [[.object]] block
# with path = "neighbors" creates one metric per array element -- proper
# support for arrays-of-objects, unlike the plain scalar "field" type we
# had to work around for the packets' path array.
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  name_override = "meshcore_neighbors"
  servers = ["tcp://mosquitto:1883"]
  topics = ["meshcore/DUQ/+/neighbors"]
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.999999-07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origin"
      rename = "station"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origin_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "total_neighbors"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "truncated"
      type = "bool"

    # One metric per array element. pubkey/status as tags (small,
    # bounded cardinality -- matches how origin_id is already tagged
    # elsewhere); snr/heard_secs_ago/scopes as fields.
    # heard_secs_ago can be JSON null per the docs ("last heard before
    # the clock was set" -- treat null as unknown, never as 0). Untested
    # here how json_v2 handles a literal null in an object array element;
    # worth checking once real data includes one, same caution that
    # caught the packets' path field being an array, not a string.
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "neighbors"
      tags = ["pubkey", "status"]

# ---------------------------------------------------------------------------
# meshcore_names  <-  rvtc/meshcore/names/+
#
# Fed by meshcore_name_resolver.py (config/scripts/, meshcore_names.service),
# not by the observer firmware directly -- ADVERT payloads are never
# decoded on-device, only forwarded as raw bytes. Retained MQTT messages,
# so Telegraf gets the full known-names directory immediately on every
# (re)connect, not just newly-heard adverts going forward.
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  name_override = "meshcore_names"
  servers = ["tcp://mosquitto:1883"]
  topics = ["rvtc/meshcore/names/+"]
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "updated"
    timestamp_format = "2006-01-02T15:04:05.999999-07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "pubkey"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "name"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "lat"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "lon"
      type = "float"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "heard_by"
      type = "string"
      optional = true
