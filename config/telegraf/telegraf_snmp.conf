# ============================================================================
# RVTC — Telegraf SNMP inputs
# Confirmed via manual snmpwalk discovery, 2026-07-07.
# Community string: public (all three devices, current state — revisit
# switching to unique per-device strings or SNMPv3 later; NAS already has
# v3 configured and ready if you want to migrate it independently).
#
# Drop these [[inputs.snmp]] blocks into telegraf.conf alongside the existing
# mqtt_consumer input from Phase 2. Output bucket: point these at rvtc_unified
# same as the MQTT data, or a separate bucket (e.g. rvtc_snmp) if you'd rather
# keep SNMP-sourced data isolated for now — your call.
# ============================================================================

# ---------------------------------------------------------------------------
# MikroTik CRS109-8G-1S-2HnD — RouterOS 7.23.2
# ---------------------------------------------------------------------------
[[inputs.snmp]]
  agents = ["udp://192.168.88.1:161"]
  version = 2
  community = "public"
  name = "mikrotik"
  interval = "30s"

  # Router identity / uptime — one row, no table needed
  [[inputs.snmp.field]]
    name = "sysUptime"
    oid = "1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # Per-interface table — traffic, errors, link state
  # Confirmed interfaces: rogers-wan, starlink-wan, ether3-8, sfp1, wlan1, bridge, lo
  [[inputs.snmp.table]]
    name = "mikrotik_interface"
    inherit_tags = ["sysName"]

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "1.3.6.1.2.1.2.2.1.16"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "1.3.6.1.2.1.2.2.1.20"

# ---------------------------------------------------------------------------
# Brother MFC-L2710DW (NC-9300h network card)
# NOTE: toner level is NOT usable — this model reports the RFC 3805 "level
# unknown" sentinel (-3) rather than a real percentage. Drum unit and page
# count ARE real, gradeable values. Don't wire toner in; it'll just be noise.
# ---------------------------------------------------------------------------
[[inputs.snmp]]
  agents = ["udp://192.168.88.20:161"]
  version = 2
  community = "public"
  name = "brother_printer"
  interval = "5m"   # slow-changing metrics — no need to poll frequently

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # Drum unit — row 2 of the marker-supplies table
  [[inputs.snmp.field]]
    name = "drum_level"
    oid = "1.3.6.1.2.1.43.11.1.1.9.1.2"

  [[inputs.snmp.field]]
    name = "drum_max_capacity"
    oid = "1.3.6.1.2.1.43.11.1.1.8.1.2"

  # Lifetime page count (sheets)
  [[inputs.snmp.field]]
    name = "page_count_lifetime"
    oid = "1.3.6.1.2.1.43.10.2.1.4.1.1"

# ---------------------------------------------------------------------------
# Synology DS223 — DSM 7.4-90075
# Community currently "public" (matches the other two — was "rvtc",
# changed for consistency during discovery testing).
# ---------------------------------------------------------------------------
[[inputs.snmp]]
  agents = ["udp://192.168.88.4:161"]
  version = 2
  community = "public"
  name = "synology_nas"
  interval = "1m"

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # System-level health (synology system MIB)
  [[inputs.snmp.field]]
    name = "system_temperature"
    oid = "1.3.6.1.4.1.6574.1.2.0"

  [[inputs.snmp.field]]
    name = "system_status"     # 1 = normal
    oid = "1.3.6.1.4.1.6574.1.5.4.0"

  # Disk 1 — model MK6475GSX, the placeholder 8GB-class drive currently installed
  [[inputs.snmp.field]]
    name = "disk1_temperature"
    oid = "1.3.6.1.4.1.6574.2.1.1.6.0"

  [[inputs.snmp.field]]
    name = "disk1_status"      # 1 = normal
    oid = "1.3.6.1.4.1.6574.2.1.1.5.0"

  # Volume / storage pool table — two entries confirmed present
  [[inputs.snmp.table]]
    name = "synology_volume"
    inherit_tags = ["sysName"]

    [[inputs.snmp.table.field]]
      name = "volume_name"
      oid = "1.3.6.1.4.1.6574.3.1.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "volume_status"   # 1 = normal
      oid = "1.3.6.1.4.1.6574.3.1.1.3"

    [[inputs.snmp.table.field]]
      name = "volume_total_bytes"
      oid = "1.3.6.1.4.1.6574.3.1.1.5"

    [[inputs.snmp.table.field]]
      name = "volume_used_bytes"
      oid = "1.3.6.1.4.1.6574.3.1.1.4"

  # SMART attribute table — 24 rows, keyed by attribute name.
  # All confirmed reporting "OK" status at discovery time.
  [[inputs.snmp.table]]
    name = "synology_smart"
    inherit_tags = ["sysName"]

    [[inputs.snmp.table.field]]
      name = "attribute_name"
      oid = "1.3.6.1.4.1.6574.5.1.1.3"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "attribute_value"
      oid = "1.3.6.1.4.1.6574.5.1.1.5"

    [[inputs.snmp.table.field]]
      name = "attribute_worst"
      oid = "1.3.6.1.4.1.6574.5.1.1.6"

    [[inputs.snmp.table.field]]
      name = "attribute_threshold"
      oid = "1.3.6.1.4.1.6574.5.1.1.7"

    [[inputs.snmp.table.field]]
      name = "attribute_raw"
      oid = "1.3.6.1.4.1.6574.5.1.1.10"

    [[inputs.snmp.table.field]]
      name = "attribute_status"
      oid = "1.3.6.1.4.1.6574.5.1.1.9"

[[outputs.influxdb_v2]]
