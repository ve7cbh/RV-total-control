# ============================================================
# telegraf_grid.conf — RVTC Grid/Generator MQTT → InfluxDB
# ============================================================
# Subscribes to rvtc/sensors/grid/# and rvtc/sensors/generator/#
# and writes to InfluxDB bucket "rvtc", measurements "grid"
# and "generator".
#
# Add to docker-compose.yml telegraf service volumes:
#   - ./config/telegraf_grid.conf:/etc/telegraf/telegraf_grid.conf:ro
#
# Then add to telegraf command or merge into telegraf_solar.conf
# ============================================================

[[inputs.mqtt_consumer]]
  name_override = "grid"
  servers       = ["tcp://mosquitto:1883"]
  topics        = ["rvtc/sensors/grid/#"]
  data_format   = "float"

  [inputs.mqtt_consumer.tags]
    source = "kws303l_grid"

[[inputs.mqtt_consumer]]
  name_override = "generator"
  servers       = ["tcp://mosquitto:1883"]
  topics        = ["rvtc/sensors/generator/#"]
  data_format   = "float"

  [inputs.mqtt_consumer.tags]
    source = "kws303l_generator"
