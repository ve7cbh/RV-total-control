# ============================================================
# telegraf_solar.conf — RVTC Solar MQTT → InfluxDB
# ============================================================
# Subscribes to rvtc/sensors/solar/# on Mosquitto and writes
# all solar fields into InfluxDB bucket "rvtc",
# measurement "solar".
#
# This gets solar data into Grafana immediately, using the
# same InfluxDB bucket WeeWX already writes to — no new
# infrastructure needed.
#
# Run as a Docker container alongside the existing stack:
#   docker run -d --name telegraf \
#     --network rvtc_net \
#     -v ~/RV-total-control/config/telegraf_solar.conf:/etc/telegraf/telegraf.conf:ro \
#     telegraf:latest
#
# Or add to docker-compose.yml — see note at bottom.
#
# Requires: InfluxDB token with write access to rvtc bucket.
# Set INFLUXDB_TOKEN environment variable before running, or
# paste the token directly into the token field below.
# ============================================================

[agent]
  interval          = "10s"
  round_interval    = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval    = "10s"
  flush_jitter      = "2s"
  precision         = "1s"
  hostname          = "ve7cbh-control"
  omit_hostname     = false

# ── Input: MQTT subscriber ────────────────────────────────────────────────────

[[inputs.mqtt_consumer]]
  name_override = "solar"
  ## Mosquitto broker on J45 — use container name on rvtc_net
  servers = ["tcp://mosquitto:1883"]

  ## Subscribe to all solar fields published by epever_mqtt.py
  topics = ["rvtc/sensors/solar/#"]

  ## Data format: each message is a plain scalar (float or string)
  ## Field name comes from the last segment of the topic path
  data_format = "value"
  data_type = "float"

  ## Tag the measurement with the source device
  [inputs.mqtt_consumer.tags]
    source = "epever_mppt60"

# ── Processor: extract field name from topic path ─────────────────────────────

[[processors.regex]]
  ## Pull the last path segment (e.g. "pv_voltage") from the MQTT topic
  ## and use it as the field name in InfluxDB.
  [[processors.regex.tags]]
    key    = "topic"
    pattern = "^rvtc/sensors/solar/(.+)$"
    replacement = "${1}"
    result_key = "solar_field"

# ── Output: InfluxDB v2 ───────────────────────────────────────────────────────

[[outputs.influxdb_v2]]
  ## Use container name on rvtc_net
  urls = ["http://influxdb:8086"]

  ## Token — set via environment variable INFLUXDB_TOKEN
  ## or paste directly (never commit to git if pasted)
  token  = "JJ6YvsntjdwdTwhe-8GYPMY0mjWhpp_MYTdmgwgfTnDFMtJRN0lWATXPslkh-DHcOD6CVon662twulqL6tfEvQ=="
  organization = "rvtc"
  bucket = "rvtc"

  ## Write to measurement "solar" — consistent with dashboard queries
  ## and distinguishable from WeeWX "weewx" measurement in same bucket
  [outputs.influxdb_v2.tagpass]
    # Only write from this input
    source = ["epever_mppt60"]

# ============================================================
# docker-compose.yml snippet to add Telegraf to the stack:
#
#   telegraf:
#     image: telegraf:latest
#     container_name: telegraf
#     restart: unless-stopped
#     networks:
#       - rvtc_net
#     volumes:
#       - ./config/telegraf_solar.conf:/etc/telegraf/telegraf.conf:ro
#     environment:
#       - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
#     depends_on:
#       - mosquitto
#       - influxdb
#
# Add INFLUXDB_TOKEN to ~/.env or export in shell before
# running docker compose up.
# ============================================================

[[inputs.mqtt_consumer]]
  name_override = "grid"
  servers       = ["tcp://mosquitto:1883"]
  topics        = ["rvtc/sensors/grid/#"]
  data_format = "value"
  data_type = "float"

  [inputs.mqtt_consumer.tags]
    source = "kws303l_grid"

[[inputs.mqtt_consumer]]
  name_override = "generator"
  servers       = ["tcp://mosquitto:1883"]
  topics        = ["rvtc/sensors/generator/#"]
  data_format   = "value"
  data_type     = "float"

  [inputs.mqtt_consumer.tags]
    source = "kws303l_generator"
