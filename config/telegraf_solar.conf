# telegraf_solar.conf — RVTC Solar + Inverter MQTT → InfluxDB

[[inputs.mqtt_consumer]]
  name_override = "solar"
  servers       = ["tcp://mosquitto:1883"]
  topics        = ["rvtc/sensors/solar/#"]
  data_format   = "value"
  data_type     = "float"
  [inputs.mqtt_consumer.tags]
    source = "epever_mppt60"

[[processors.regex]]
  [[processors.regex.tags]]
    key         = "topic"
    pattern     = "^rvtc/sensors/solar/(.+)$"
    replacement = "${1}"
    result_key  = "solar_field"

[[inputs.mqtt_consumer]]
  name_override = "inverter"
  servers       = ["tcp://mosquitto:1883"]
  topics        = [
    "rvtc/sensors/inverter/operating_mode",
    "rvtc/sensors/inverter/error_code",
    "rvtc/sensors/inverter/charge_stage",
    "rvtc/sensors/inverter/firmware_version",
    "rvtc/sensors/inverter/compensating_voltage",
    "rvtc/sensors/inverter/poll_errors",
    "rvtc/sensors/inverter/status_gen_input",
    "rvtc/sensors/inverter/freq_gen_input",
    "rvtc/sensors/inverter/voltage_gen_input",
    "rvtc/sensors/inverter/status_grid_input",
    "rvtc/sensors/inverter/freq_grid_input",
    "rvtc/sensors/inverter/voltage_grid_input",
    "rvtc/sensors/inverter/input_current",
    "rvtc/sensors/inverter/input_va",
    "rvtc/sensors/inverter/input_watt",
    "rvtc/sensors/inverter/output_frequency",
    "rvtc/sensors/inverter/output_voltage",
    "rvtc/sensors/inverter/invert_charge_current",
    "rvtc/sensors/inverter/invert_charge_va",
    "rvtc/sensors/inverter/invert_charge_watt",
    "rvtc/sensors/inverter/battery_voltage",
    "rvtc/sensors/inverter/battery_current",
    "rvtc/sensors/inverter/external_current",
    "rvtc/sensors/inverter/battery_temperature",
    "rvtc/sensors/inverter/transformer_temperature",
    "rvtc/sensors/inverter/busbar_temperature",
    "rvtc/sensors/inverter/heatsink_temperature",
    "rvtc/sensors/inverter/fan_speed"
  ]
  data_format   = "value"
  data_type     = "float"
  [inputs.mqtt_consumer.tags]
    source = "samlux_evo2212"

[[outputs.influxdb_v2]]
