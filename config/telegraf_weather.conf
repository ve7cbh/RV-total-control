# telegraf_weather.conf — RVTC Weather → InfluxDB (via WeeWX-corrected MQTT topic)
# WeeWX (MQTTSubscribeDriver) ingests raw WN90 data, applies unit conversion,
# StdWXCalculate (barometer/dewpoint/heatindex), and rain totalizing, then
# republishes the corrected archive record here. Telegraf just relays it to
# InfluxDB uniformly, same as solar/grid/inverter — no custom Python needed.

[[inputs.mqtt_consumer]]
  name_override = "weewx"
  servers       = ["tcp://192.168.88.3:1883"]
  topics        = ["rvtc/sensors/weather/corrected"]
  data_format   = "json"
  [inputs.mqtt_consumer.tags]
    source = "wn90lp"

[[outputs.influxdb_v2]]
  urls         = ["http://192.168.88.3:8086"]
  token        = "JJ6YvsntjdwdTwhe-8GYPMY0mjWhpp_MYTdmgwgfTnDFMtJRN0lWATXPslkh-DHcOD6CVon662twulqL6tfEvQ=="
  organization = "rvtc"
  bucket       = "rvtc"