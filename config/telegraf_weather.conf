[[inputs.mqtt_consumer]]
  name_override = "weewx"
  servers       = ["tcp://192.168.88.3:1883"]
  topics        = ["rvtc/sensors/weather/corrected/loop"]
  data_format   = "json_v2"
  [inputs.mqtt_consumer.tags]
    source = "wn90lp"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "outTemp_C"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "outHumidity"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "windSpeed_mps"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "windGust_mps"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "barometer_mbar"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rain_mm"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "UV"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "radiation_Wpm2"
      type = "float"

