services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /data/docker/volumes/mosquitto/config:/mosquitto/config
      - /data/docker/volumes/mosquitto/data:/mosquitto/data
      - /data/docker/volumes/mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - /data/docker/volumes/influxdb:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "3000:3000"
    volumes:
      - /data/docker/volumes/grafana:/var/lib/grafana
    depends_on:
      - influxdb

  weewx:
    image: felddy/weewx:latest
    container_name: weewx
    restart: unless-stopped
    volumes:
      - /data/docker/volumes/weewx:/data
    environment:
      - TZ=America/Vancouver
    depends_on:
      - mosquitto
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"  

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /data/docker/volumes/weewx/public_html:/usr/share/nginx/html:ro
      - /data/docker/volumes/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/docker/volumes/nginx/rvtc:/usr/share/nginx/rvtc:ro
    depends_on:
      - grafana
      - weewx

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/docker/volumes/homeassistant:/config
    environment:
      - TZ=America/Vancouver

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8880:80"
    volumes:
      - /data/docker/volumes/pihole/etc-pihole:/etc/pihole
      - /data/docker/volumes/pihole/etc-dnsmasq:/etc/dnsmasq.d
    environment:
      - TZ=America/Vancouver
      - FTLCONF_dns_listeningMode=all

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    volumes:
      - ./config/telegraf/telegraf_solar.conf:/etc/telegraf/telegraf.d/solar.conf:ro
      - ./config/telegraf/telegraf_grid.conf:/etc/telegraf/telegraf.d/grid.conf:ro
      - ./config/telegraf/telegraf_generator.conf:/etc/telegraf/telegraf.d/generator.conf:ro
      - ./config/telegraf/telegraf_weather.conf:/etc/telegraf/telegraf.d/weather.conf:ro
      - ./config/telegraf/telegraf_snmp.conf:/etc/telegraf/telegraf.d/snmp.conf:ro
    depends_on:
      - mosquitto
      - influxdb

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/docker/volumes/portainer:/data
    ports:
      - "9000:9000"
