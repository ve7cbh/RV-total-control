services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /data/docker/volumes/mosquitto/config:/mosquitto/config
      - /data/docker/volumes/mosquitto/data:/mosquitto/data
      - /data/docker/volumes/mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - /data/docker/volumes/influxdb:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "3000:3000"
    volumes:
      - /data/docker/volumes/grafana:/var/lib/grafana
    depends_on:
      - influxdb

  rtl433:
    image: hertzg/rtl_433:latest
    container_name: rtl433
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: ["-M", "si", "-F", "mqtt://mosquitto:1883,retain=1,events=rtl_433/rtl433/events"]
    depends_on:
      - mosquitto

  weewx:
    image: felddy/weewx:latest
    container_name: weewx
    restart: unless-stopped
    volumes:
      - /data/docker/volumes/weewx:/data
    environment:
      - TZ=America/Vancouver
    depends_on:
      - mosquitto

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /data/docker/volumes/weewx/public_html:/usr/share/nginx/html:ro
      - /data/docker/volumes/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - grafana
      - weewx

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/docker/volumes/homeassistant:/config
    environment:
      - TZ=America/Vancouver

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8880:80"
    volumes:
      - /data/docker/volumes/pihole/etc-pihole:/etc/pihole
      - /data/docker/volumes/pihole/etc-dnsmasq:/etc/dnsmasq.d
    environment:
      - TZ=America/Vancouver
      - FTLCONF_dns_listeningMode=all

