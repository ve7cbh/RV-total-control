---
# group_vars/all.yml
# RVTC global variables — applies to all hosts
# Version: 0.1  2026-05-27

# --- Paths ---
rvtc_data_path: /data

# --- Identity ---
rvtc_user: ve7cbh
rvtc_hostname: ve7cbh-control
rvtc_timezone: America/Vancouver

# --- Docker ---
docker_network: rvtc_net
docker_volumes_path: "{{ rvtc_data_path }}/docker/volumes"

# --- MQTT ---
mqtt_broker_host: mosquitto
mqtt_broker_port: 1883

# --- InfluxDB ---
influxdb_host: influxdb
influxdb_port: 8086
influxdb_org: rvtc
influxdb_bucket: rvtc
influxdb_token: rvtc-token-local
influxdb_image_tag: "2"
influxdb_volume: /data/docker/volumes/influxdb

# --- Grafana ---
grafana_host: grafana
grafana_port: 3000
grafana_admin_user: admin

# --- Modbus Gateway ---
hf5142b_host: 192.168.88.5
hf5142b_port_solar: 4001
hf5142b_port_inverter: 4002
hf5142b_port_water: 4003
hf5142b_port_spare: 4004

# --- Grafana ---
grafana_image_tag: latest
grafana_volume: /data/docker/volumes/grafana
