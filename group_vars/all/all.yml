---
# group_vars/all.yml
# RVTC global variables — applies to all hosts
# Version: 0.1  2026-05-27

# --- Paths ---
rvtc_data_path: /data

# --- Identity ---
rvtc_user: ve7cbh
rvtc_hostname: ve7cbh-control
rvtc_timezone: America/Vancouver

# --- Docker ---
docker_network: rvtc_net
docker_volumes_path: "{{ rvtc_data_path }}/docker/volumes"

# --- MQTT ---
mqtt_broker_host: mosquitto
mqtt_broker_port: 1883

# --- InfluxDB ---
influxdb_host: influxdb
influxdb_port: 8086
influxdb_org: rvtc
influxdb_bucket: rvtc
influxdb_token: "{{ vault_influxdb_token }}"
influxdb_image_tag: "2"
influxdb_volume: /data/docker/volumes/influxdb

# --- Grafana ---
grafana_host: grafana
grafana_port: 3000
grafana_admin_user: admin
grafana_image_tag: latest
grafana_volume: /data/docker/volumes/grafana

# --- WeeWX ---
weewx_image_tag: latest
weewx_volume: /data/docker/volumes/weewx
weewx_station_name: ve7cbh
weewx_latitude: 48.6686
weewx_longitude: -123.6002
weewx_altitude: 46
weewx_mqtt_host: mosquitto
weewx_mqtt_port: 1883
weewx_mqtt_topic: "rtl_433/Acurite-5n1/1111"

# --- Home Assistant ---
homeassistant_image_tag: stable
homeassistant_port: 8123
homeassistant_volume: /data/docker/volumes/homeassistant

# --- Pi-hole ---
pihole_image_tag: latest
pihole_web_port: 8880
pihole_volume: /data/docker/volumes/pihole

# --- Modbus Gateway ---
hf5142b_host: 192.168.88.5
hf5142b_port_solar: 4001
hf5142b_port_inverter: 4002
hf5142b_port_water: 4003
hf5142b_port_spare: 4004
