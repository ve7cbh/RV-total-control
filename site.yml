# site.yml
# RVTC master playbook — imports phase playbooks in order
# Version: 0.1  2026-05-27
#
# Usage:
#   ansible-playbook site.yml                          # full run
#   ansible-playbook site.yml --tags phase2            # single phase
#   ansible-playbook site.yml --tags common            # single role

- name: RVTC Phase 2 — Core Stack
  import_playbook: phase2.yml
  tags: phase2

